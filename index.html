<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already defined
        }

        // Prevent uncaught error event from bubbling if a third-party script attempts fetch assignment
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch of') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>PlanCraft Studio - Sistem Konten Terpadu</title>
